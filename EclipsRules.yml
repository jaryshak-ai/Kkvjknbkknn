name: Build EclipsRules

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Create project files
        run: |
          mkdir -p src/main/java/ru/eclips/rules
          mkdir -p src/main/resources

          cat > pom.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>

              <groupId>ru.eclips</groupId>
              <artifactId>EclipsRules</artifactId>
              <version>1.0.0</version>
              <packaging>jar</packaging>

              <properties>
                  <maven.compiler.source>17</maven.compiler.source>
                  <maven.compiler.target>17</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>lanink-repo</id>
                      <url>https://repo.lanink.cn/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>cn.nukkit</groupId>
                      <artifactId>Nukkit</artifactId>
                      <version>MOT-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <finalName>EclipsRules</finalName>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.11.0</version>
                          <configuration>
                              <source>17</source>
                              <target>17</target>
                              <encoding>UTF-8</encoding>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

          cat > src/main/resources/plugin.yml << 'EOF'
          name: EclipsRules
          main: ru.eclips.rules.EclipsRules
          version: 1.0.0
          api: ["1.0.5"]
          author: Eclips
          description: Server rules window
          commands:
            rules:
              description: Server rules
              usage: /rules
              permission: rules.use
          permissions:
            rules.use:
              description: Open the rules window
              default: true
            rules.admin:
              description: Reload rules
              default: op
          EOF

          cat > src/main/resources/config.yml << 'EOF'
          # ===== EclipsRules: настройки окна /rules =====
          # Цвета пишутся через знак &, например &c (красный), &l (жирный), &r (сброс).
          # Тексты самих правил лежат в файле rules.yml.
          # После изменений выполните команду /rules reload (право rules.admin).

          # Заголовок окна
          title: "&lПравила сервера Eclips"

          # Текст над списком правил (пусто = не показывать)
          header: "Прочитай правила, чтобы не получить наказание."

          # Текст под списком правил (пусто = не показывать)
          # Например, контакты для оспаривания наказаний.
          footer: ""

          # Текст кнопки закрытия (жирный шрифт через &l)
          close_button: "&lЗакрыть"

          # Оформление названий разделов (&l = жирный)
          section_prefix: "&l"
          EOF

          cat > src/main/resources/rules.yml << 'EOF'
          # ===== EclipsRules: список правил =====
          # Разделы показываются в окне подряд, сверху вниз.
          # Для каждого раздела: title (название) и lines (список пунктов).
          # Наказание можно выделять цветом: &c...&r (красный, затем сброс цвета).
          # Не используйте белый, жёлтый и чёрный цвета: они плохо видны на тёмном или светлом фоне.
          # После изменений выполните команду /rules reload (право rules.admin).

          sections:
            - title: "1. Чат"
              lines:
                - "1.1 Оскорбление игроков: &cмут 1 час&r"
                - "1.2 Оскорбление родных, угрозы: &cмут 1 день&r"
                - "1.3 Спам, флуд, капс: &cпредупреждение, затем мут 15 минут&r"
                - "1.4 Реклама других серверов, ссылок, каналов: &cмут 1 день&r"
                - "1.5 Политика, национализм, 18+ контент: &cмут 1 день&r"

            - title: "2. Игра"
              lines:
                - "2.1 Читы, хак-клиенты, любые моды с преимуществом: &cбан 7 дней&r"
                - "2.2 Использование багов и дюпов: &cбан 7 дней и откат предметов&r. Если игрок сам сообщил о баге админу, он получает награду."
                - "2.3 Намеренное создание излишней нагрузки на сервер (лаг-машины): &cбан 3 дня и удаление лаг-машины&r"

            - title: "3. Общее"
              lines:
                - "3.1 Обход наказания (мута или бана, в том числе по IP): &cсрок мута или бана продлевается вдвое. При обходе мута выдаётся бан на 1 день&r"
                - "3.2 Оскорбление администрации: &cмут 2 часа&r"
                - "3.3 Обман администрации ради игровых преимуществ (например, заявка на компенсацию за баг, которого не было): &cбан 2 дня&r"
                - "3.4 Незнание правил не освобождает от ответственности."

            - title: "4. Выдача наказаний донатерами"
              lines:
                - "4.1 На любое наказание у вас должны быть доказательства. За нарушение: &cбан на 1 день, при повторе снятие привилегии&r"
                - "4.2 Наказание игрока не по пунктам правил или по выдуманной причине: &cбан на 1 день, при повторе снятие привилегии&r"
                - "4.3 Кик, бан или мут с оскорбительной причиной: &cснятие привилегии&r"
          EOF

          cat > src/main/java/ru/eclips/rules/EclipsRules.java << 'EOF'
          package ru.eclips.rules;

          import cn.nukkit.Player;
          import cn.nukkit.command.Command;
          import cn.nukkit.command.CommandSender;
          import cn.nukkit.form.element.ElementButton;
          import cn.nukkit.form.window.FormWindowSimple;
          import cn.nukkit.plugin.PluginBase;
          import cn.nukkit.utils.Config;

          import java.io.File;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Map;

          public class EclipsRules extends PluginBase {

              private static final String DEFAULT_TITLE = "§lПравила сервера Eclips";
              private static final String DEFAULT_CLOSE = "§lЗакрыть";

              private volatile String formTitle = DEFAULT_TITLE;
              private volatile String closeButton = DEFAULT_CLOSE;
              private volatile String formContent = "";
              private volatile List<String> consoleLines = new ArrayList<>();

              @Override
              public void onEnable() {
                  try {
                      getDataFolder().mkdirs();
                      saveDefaultConfig();
                      saveResource("rules.yml", false);
                  } catch (Throwable t) {
                      getLogger().warning("Не удалось создать файлы настроек: " + t);
                  }
                  loadAll();
                  getLogger().info("EclipsRules включён.");
              }

              private static String color(String s) {
                  if (s == null) {
                      return "";
                  }
                  return s.replace('&', '§');
              }

              private static String strip(String s) {
                  return s.replaceAll("§.", "");
              }

              private void loadAll() {
                  try {
                      Config cfg = new Config(new File(getDataFolder(), "config.yml"), Config.YAML);
                      Config rules = new Config(new File(getDataFolder(), "rules.yml"), Config.YAML);

                      String title = color(cfg.getString("title", "&lПравила сервера Eclips"));
                      String header = color(cfg.getString("header", ""));
                      String footer = color(cfg.getString("footer", ""));
                      String close = color(cfg.getString("close_button", "&lЗакрыть"));
                      String sectionPrefix = color(cfg.getString("section_prefix", "&l"));

                      if (title.isEmpty()) {
                          title = DEFAULT_TITLE;
                      }
                      if (close.isEmpty()) {
                          close = DEFAULT_CLOSE;
                      }

                      StringBuilder body = new StringBuilder();
                      List<String> plain = new ArrayList<>();

                      if (!header.isEmpty()) {
                          body.append(header).append("§r\n");
                          plain.add(strip(header));
                      }

                      Object sectionsObj = rules.get("sections");
                      if (sectionsObj instanceof List) {
                          for (Object sectionObj : (List<?>) sectionsObj) {
                              if (!(sectionObj instanceof Map)) {
                                  continue;
                              }
                              Map<?, ?> section = (Map<?, ?>) sectionObj;

                              Object titleObj = section.get("title");
                              if (titleObj != null) {
                                  String sectionTitle = color(String.valueOf(titleObj));
                                  body.append("\n").append(sectionPrefix).append(sectionTitle).append("§r\n");
                                  plain.add("");
                                  plain.add(strip(sectionTitle));
                              }

                              Object linesObj = section.get("lines");
                              if (linesObj instanceof List) {
                                  for (Object lineObj : (List<?>) linesObj) {
                                      if (lineObj == null) {
                                          continue;
                                      }
                                      String line = color(String.valueOf(lineObj));
                                      body.append(line).append("§r\n");
                                      plain.add(strip(line));
                                  }
                              }
                          }
                      }

                      if (!footer.isEmpty()) {
                          body.append("\n").append(footer).append("§r\n");
                          plain.add("");
                          plain.add(strip(footer));
                      }

                      this.formTitle = title;
                      this.closeButton = close;
                      this.formContent = body.toString();
                      this.consoleLines = plain;
                  } catch (Throwable t) {
                      getLogger().warning("Ошибка чтения настроек: " + t);
                  }
              }

              private void sendAsText(CommandSender sender) {
                  try {
                      sender.sendMessage(strip(formTitle));
                      for (String line : consoleLines) {
                          sender.sendMessage(line);
                      }
                  } catch (Throwable ignored) {
                      // Ничего не показываем при сбое.
                  }
              }

              private void openRules(Player player) {
                  try {
                      FormWindowSimple form = new FormWindowSimple(formTitle, formContent);
                      form.addButton(new ElementButton(closeButton));
                      player.showFormWindow(form);
                  } catch (Throwable t) {
                      getLogger().warning("Не удалось открыть форму правил: " + t);
                      sendAsText(player);
                  }
              }

              @Override
              public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
                  if (!command.getName().equalsIgnoreCase("rules")) {
                      return false;
                  }

                  if (args.length > 0 && args[0].equalsIgnoreCase("reload") && sender.hasPermission("rules.admin")) {
                      loadAll();
                      try {
                          sender.sendMessage("§aПравила перезагружены.");
                      } catch (Throwable ignored) {
                          // Ничего не показываем при сбое.
                      }
                      return true;
                  }

                  if (sender instanceof Player) {
                      openRules((Player) sender);
                  } else {
                      sendAsText(sender);
                  }
                  return true;
              }
          }
          EOF

      - name: Build with Maven
        run: mvn -B package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: EclipsRules
          path: target/EclipsRules.jar
